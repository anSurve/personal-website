AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Personal website backend: API Gateway + Lambda + DynamoDB for a blog and
  guestbook, plus an S3 bucket for the static frontend.

Parameters:
  FrontendBucketName:
    Type: String
    Default: aniketsurve-personal-website
    Description: Globally unique S3 bucket name to host the static frontend.
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: >
      Allowed origin for API responses. Set to your S3 website URL (or custom
      domain) after the first deploy, then redeploy to lock it down.
  SongsUploadPasswordHash:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      SHA-256 hex hash of the password required to use the "Add Song" button
      on the site. Leave blank to disable the feature. Generate with:
      python -c "import hashlib, getpass; print(hashlib.sha256(getpass.getpass().encode()).hexdigest())"
      Pass this via --parameter-overrides at deploy time -- never commit a
      real hash as this parameter's Default, since this repo is public.
  AuthDomainPrefix:
    Type: String
    Default: aniketsurve-auth
    Description: >
      Prefix for the Cognito sign-in domain
      (<prefix>.auth.<region>.amazoncognito.com). Must be globally unique.
  GoogleClientId:
    Type: String
    Default: ""
    Description: >
      OAuth client ID from Google Cloud Console. Leave blank to offer only
      email/password sign-in; set it (with GoogleClientSecret) to add
      "Continue with Google".
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      OAuth client secret matching GoogleClientId. Pass via
      --parameter-overrides; never commit it, since this repo is public.

  SiteDomain:
    Type: String
    Default: aniketsurve.com
    Description: >
      Custom domain served by CloudFront (www.<domain> redirects to it).
      Leave blank to use only the *.cloudfront.net address.
  SiteCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:792520190246:certificate/78558c4b-54f2-470d-82b1-0563bb0876a3
    Description: >
      ACM certificate in us-east-1 covering SiteDomain and www.SiteDomain
      (CloudFront only accepts us-east-1 certificates).
  SiteHostedZoneId:
    Type: String
    Default: Z01075611OYA1TZ92U1TC
    Description: Route 53 hosted zone for SiteDomain, where the DNS records are created.

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  HasDomain: !Not [!Equals [!Ref SiteDomain, ""]]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 128

Resources:
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-posts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  GuestbookTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-guestbook"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # Per-user, per-app progress (e.g. lessons visited in the Agentic AI course).
  # Retained on stack deletion so users' progress is never lost by accident.
  ProgressTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-progress"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: app
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: app
          KeyType: RANGE

  # ---- Sign-in: Cognito user pool with email/password and optional Google ----
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false

  # Sign-in pages: Cognito Managed Login (v2), styled by LoginBranding. Waits for
  # the style to exist so the new pages are never served unstyled.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    DependsOn: LoginBranding
    Properties:
      Domain: !Ref AuthDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name
        picture: picture

  # Public browser client: authorization code flow with PKCE, no client secret.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: website
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !If [HasDomain, !Sub "https://${SiteDomain}/auth/callback.html", !Ref AWS::NoValue]
        - !Sub "https://${SiteDistribution.DomainName}/auth/callback.html"
        - http://localhost:8765/auth/callback.html
      LogoutURLs:
        - !If [HasDomain, !Sub "https://${SiteDomain}/auth/callback.html", !Ref AWS::NoValue]
        - !Sub "https://${SiteDistribution.DomainName}/auth/callback.html"
        - http://localhost:8765/auth/callback.html
      SupportedIdentityProviders: !If
        - HasGoogle
        - [COGNITO, !Ref GoogleIdentityProvider]
        - [COGNITO]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  # Look of the sign-in pages, matching the site: its colors in light and dark
  # mode (follows the visitor's setting), the "AS" logo (backend/branding/logo.svg)
  # and Cognito's Google icon. Generated by scripts/login_branding.py; rerun that
