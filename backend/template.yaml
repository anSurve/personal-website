  # ---- HTTPS in front of the S3 website (needed for sign-in) ----
  SiteCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-site"
        MinTTL: 0
        DefaultTTL: 300
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # Sends www.<domain> to the bare domain so the site has one address.
  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Condition: HasDomain
    Properties:
      Name: !Sub "${AWS::StackName}-www-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to the apex domain
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var host = req.headers.host ? req.headers.host.value : "";
          if (host.indexOf("www.") !== 0) return req;
          var qs = Object.keys(req.querystring).map(function (k) {
            var v = req.querystring[k];
            return v.value ? k + "=" + v.value : k;
          }).join("&");
          return {
            statusCode: 301,
            statusDescription: "Moved Permanently",
            headers: { location: { value: "https://" + host.slice(4) + req.uri + (qs ? "?" + qs : "") } },
          };
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} website (HTTPS)"
        Enabled: true
        Aliases: !If
          - HasDomain
          - [!Ref SiteDomain, !Sub "www.${SiteDomain}"]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref SiteCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: S3Website
            # WebsiteURL is http://<bucket>.s3-website-<region>.amazonaws.com
            DomainName: !Select [2, !Split ["/", !GetAtt FrontendBucket.WebsiteURL]]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3Website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref SiteCachePolicy
          FunctionAssociations: !If
            - HasDomain
            - - EventType: viewer-request
                FunctionARN: !GetAtt WwwRedirectFunction.FunctionMetadata.FunctionARN
            - !Ref AWS::NoValue

  # DNS: <domain> and www.<domain> -> CloudFront (IPv4 and IPv6)
  SiteDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref SiteHostedZoneId
      RecordSets:
        - Name: !Ref SiteDomain
          Type: A
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2  # fixed zone id for all CloudFront aliases
        - Name: !Ref SiteDomain
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2  # fixed zone id for all CloudFront aliases
        - Name: !Sub "www.${SiteDomain}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2  # fixed zone id for all CloudFront aliases
        - Name: !Sub "www.${SiteDomain}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2  # fixed zone id for all CloudFront aliases

  WebsiteApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${CorsAllowOrigin}'"
      Auth:
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
      # Let the browser read 401/403s from the authorizer instead of a CORS error.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  ProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: progress.handler
      Environment:
        Variables:
          PROGRESS_TABLE: !Ref ProgressTable
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProgressTable
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /progress/{app}
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        Put:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /progress/{app}
            Method: PUT
            Auth:
              Authorizer: CognitoAuth

  PostsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: posts_list.handler
      Environment:
        Variables:
          POSTS_TABLE: !Ref PostsTable
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostsTable
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /posts
            Method: GET

  PostsGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: posts_get.handler
      Environment:
        Variables:
          POSTS_TABLE: !Ref PostsTable
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostsTable
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /posts/{id}
            Method: GET

  GuestbookListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: guestbook_list.handler
      Environment:
        Variables:
          GUESTBOOK_TABLE: !Ref GuestbookTable
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GuestbookTable
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /guestbook
            Method: GET

  GuestbookCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: guestbook_create.handler
      Environment:
        Variables:
          GUESTBOOK_TABLE: !Ref GuestbookTable
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref GuestbookTable
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /guestbook
            Method: POST

  SongsUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: songs_upload_url.handler
      Environment:
        Variables:
          FRONTEND_BUCKET: !Ref FrontendBucketName
          UPLOAD_PASSWORD_HASH: !Ref SongsUploadPasswordHash
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${FrontendBucket.Arn}/songs/*"
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /songs/upload-url
            Method: POST

  SongsConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: songs_confirm.handler
      Environment:
        Variables:
          FRONTEND_BUCKET: !Ref FrontendBucketName
          UPLOAD_PASSWORD_HASH: !Ref SongsUploadPasswordHash
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${FrontendBucket.Arn}/songs/manifest.json"
            # GetObject on a missing key returns AccessDenied instead of a
            # clean 404 unless the caller also has ListBucket -- needed the
            # very first time, before manifest.json exists.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt FrontendBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: "songs/*"
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /songs/confirm
            Method: POST

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref FrontendBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins:
              - !Ref CorsAllowOrigin
            AllowedHeaders: ["*"]
            MaxAge: 3000

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

Outputs:
  ApiUrl:
    Description: Base URL for the API. Paste into frontend/js/config.js
    Value: !Sub "https://${WebsiteApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  WebsiteURL:
    Description: S3 static website URL (HTTP only; add CloudFront for HTTPS/custom domain later)
    Value: !GetAtt FrontendBucket.WebsiteURL
  FrontendBucketNameOutput:
    Description: Name of the S3 bucket to sync the frontend files to
    Value: !Ref FrontendBucket
  SiteURL:
    Description: HTTPS address of the site. Use this one; sign-in only works over HTTPS.
    Value: !If [HasDomain, !Sub "https://${SiteDomain}", !Sub "https://${SiteDistribution.DomainName}"]
  CloudFrontURL:
    Description: The distribution's own address (keeps working alongside the custom domain)
    Value: !Sub "https://${SiteDistribution.DomainName}"
  DistributionId:
    Description: CloudFront distribution ID, for cache invalidations after a frontend deploy
    Value: !Ref SiteDistribution
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Paste into frontend/js/config.js (AUTH_CONFIG.clientId)
    Value: !Ref UserPoolClient
  AuthDomain:
    Description: Paste into frontend/js/config.js (AUTH_CONFIG.domain)
    Value: !Sub "${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  GoogleRedirectURI:
    Description: Add this as an "Authorized redirect URI" on the Google OAuth client
    Value: !Sub "https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
  ProgressTableName:
    Value: !Ref ProgressTable
  PostsTableName:
    Value: !Ref PostsTable
  GuestbookTableName:
    Value: !Ref GuestbookTable
