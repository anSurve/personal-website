AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Personal website backend: API Gateway + Lambda + DynamoDB for a blog and
  guestbook, plus an S3 bucket for the static frontend.

Parameters:
  FrontendBucketName:
    Type: String
    Default: aniketsurve-personal-website
    Description: Globally unique S3 bucket name to host the static frontend.
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: >
      Allowed origin for API responses. Set to your S3 website URL (or custom
      domain) after the first deploy, then redeploy to lock it down.
  SongsUploadPasswordHash:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      SHA-256 hex hash of the password required to use the "Add Song" button
      on the site. Leave blank to disable the feature. Generate with:
      python -c "import hashlib, getpass; print(hashlib.sha256(getpass.getpass().encode()).hexdigest())"
      Pass this via --parameter-overrides at deploy time -- never commit a
      real hash as this parameter's Default, since this repo is public.
  AuthDomainPrefix:
    Type: String
    Default: aniketsurve-auth
    Description: >
      Prefix for the Cognito sign-in domain
      (<prefix>.auth.<region>.amazoncognito.com). Must be globally unique.
  GoogleClientId:
    Type: String
    Default: ""
    Description: >
      OAuth client ID from Google Cloud Console. Leave blank to offer only
      email/password sign-in; set it (with GoogleClientSecret) to add
      "Continue with Google".
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      OAuth client secret matching GoogleClientId. Pass via
      --parameter-overrides; never commit it, since this repo is public.

  SiteDomain:
    Type: String
    Default: aniketsurve.com
    Description: >
      Custom domain served by CloudFront (www.<domain> redirects to it).
      Leave blank to use only the *.cloudfront.net address.
  SiteCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:792520190246:certificate/78558c4b-54f2-470d-82b1-0563bb0876a3
    Description: >
      ACM certificate in us-east-1 covering SiteDomain and www.SiteDomain
      (CloudFront only accepts us-east-1 certificates).
  SiteHostedZoneId:
    Type: String
    Default: Z01075611OYA1TZ92U1TC
    Description: Route 53 hosted zone for SiteDomain, where the DNS records are created.

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  HasDomain: !Not [!Equals [!Ref SiteDomain, ""]]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 128

Resources:
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-posts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  GuestbookTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-guestbook"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # Per-user, per-app progress (e.g. lessons visited in the Agentic AI course).
  # Retained on stack deletion so users' progress is never lost by accident.
  ProgressTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-progress"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: app
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: app
          KeyType: RANGE

  # ---- Sign-in: Cognito user pool with email/password and optional Google ----
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref AuthDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 1

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name
        picture: picture

  # Public browser client: authorization code flow with PKCE, no client secret.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: website
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !If [HasDomain, !Sub "https://${SiteDomain}/auth/callback.html", !Ref AWS::NoValue]
        - !Sub "https://${SiteDistribution.DomainName}/auth/callback.html"
        - http://localhost:8765/auth/callback.html
      LogoutURLs:
        - !If [HasDomain, !Sub "https://${SiteDomain}/auth/callback.html", !Ref AWS::NoValue]
        - !Sub "https://${SiteDistribution.DomainName}/auth/callback.html"
        - http://localhost:8765/auth/callback.html
      SupportedIdentityProviders: !If
        - HasGoogle
        - [COGNITO, !Ref GoogleIdentityProvider]
        - [COGNITO]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  # ---- HTTPS in front of the S3 website (needed for sign-in) ----
  SiteCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-site"
        MinTTL: 0
        DefaultTTL: 300
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # Sends www.<domain> to the bare domain so the site has one address.
  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Condition: HasDomain
    Properties:
      Name: !Sub "${AWS::StackName}-www-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to the apex domain
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var host = req.headers.host ? req.headers.host.value : "";
          if (host.indexOf("www.") !== 0) return req;
          var qs = Object.keys(req.querystring).map(function (k) {
            var v = req.querystring[k];
            return v.value ? k + "=" + v.value : k;
          }).join("&");
          return {
            statusCode: 301,
            statusDescription: "Moved Permanently",
            headers: { location: { value: "https://" + host.slice(4) + req.uri + (qs ? "?" + qs : "") } },
          };
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} website (HTTPS)"
        Enabled: true
        Aliases: !If
          - HasDomain
          - [!Ref SiteDomain, !Sub "www.${SiteDomain}"]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref SiteCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: S3Website
            # WebsiteURL is http://<bucket>.s3-website-<region>.amazonaws.com
            DomainName: !Select [2, !Split ["/", !GetAtt FrontendBucket.WebsiteURL]]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3Website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref SiteCachePolicy
          FunctionAssociations: !If
            - HasDomain
            - - EventType: viewer-request
                FunctionARN: !GetAtt WwwRedirectFunction.FunctionMetadata.FunctionARN
            - !Ref AWS::NoValue

  # DNS: <domain> and www.<domain> -> CloudFront (IPv4 and IPv6)
  SiteDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref SiteHostedZoneId
      RecordSets:
        - Name: !Ref SiteDomain
          Type: A
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2  # fixed zone id for all CloudFront aliases
        - Name: !Ref SiteDomain
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2  # fixed zone id for all CloudFront aliases
        - Name: !Sub "www.${SiteDomain}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2  # fixed zone id for all CloudFront aliases
        - Name: !Sub "www.${SiteDomain}"
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2  # fixed zone id for all CloudFront aliases

  WebsiteApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${CorsAllowOrigin}'"
      Auth:
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
      # Let the browser read 401/403s from the authorizer instead of a CORS error.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  ProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: progress.handler
      Environment:
        Variables:
          PROGRESS_TABLE: !Ref ProgressTable
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProgressTable
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /progress/{app}
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        Put:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /progress/{app}
            Method: PUT
            Auth:
              Authorizer: CognitoAuth

  PostsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: posts_list.handler
      Environment:
        Variables:
          POSTS_TABLE: !Ref PostsTable
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostsTable
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /posts
            Method: GET

  PostsGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: posts_get.handler
      Environment:
        Variables:
          POSTS_TABLE: !Ref PostsTable
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostsTable
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /posts/{id}
            Method: GET

  GuestbookListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: guestbook_list.handler
      Environment:
        Variables:
          GUESTBOOK_TABLE: !Ref GuestbookTable
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GuestbookTable
      Events:
        List:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /guestbook
            Method: GET

  GuestbookCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: guestbook_create.handler
      Environment:
        Variables:
          GUESTBOOK_TABLE: !Ref GuestbookTable
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref GuestbookTable
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /guestbook
            Method: POST

  SongsUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: songs_upload_url.handler
      Environment:
        Variables:
          FRONTEND_BUCKET: !Ref FrontendBucketName
          UPLOAD_PASSWORD_HASH: !Ref SongsUploadPasswordHash
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${FrontendBucket.Arn}/songs/*"
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /songs/upload-url
            Method: POST

  SongsConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/
      Handler: songs_confirm.handler
      Environment:
        Variables:
          FRONTEND_BUCKET: !Ref FrontendBucketName
          UPLOAD_PASSWORD_HASH: !Ref SongsUploadPasswordHash
          CORS_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${FrontendBucket.Arn}/songs/manifest.json"
            # GetObject on a missing key returns AccessDenied instead of a
            # clean 404 unless the caller also has ListBucket -- needed the
            # very first time, before manifest.json exists.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt FrontendBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: "songs/*"
      Events:
        Create:
          Type: Api
          Properties:
            RestApiId: !Ref WebsiteApi
            Path: /songs/confirm
            Method: POST

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref FrontendBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins:
              - !Ref CorsAllowOrigin
            AllowedHeaders: ["*"]
            MaxAge: 3000

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

Outputs:
  ApiUrl:
    Description: Base URL for the API. Paste into frontend/js/config.js
    Value: !Sub "https://${WebsiteApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  WebsiteURL:
    Description: S3 static website URL (HTTP only; add CloudFront for HTTPS/custom domain later)
    Value: !GetAtt FrontendBucket.WebsiteURL
  FrontendBucketNameOutput:
    Description: Name of the S3 bucket to sync the frontend files to
    Value: !Ref FrontendBucket
  SiteURL:
    Description: HTTPS address of the site. Use this one; sign-in only works over HTTPS.
    Value: !If [HasDomain, !Sub "https://${SiteDomain}", !Sub "https://${SiteDistribution.DomainName}"]
  CloudFrontURL:
    Description: The distribution's own address (keeps working alongside the custom domain)
    Value: !Sub "https://${SiteDistribution.DomainName}"
  DistributionId:
    Description: CloudFront distribution ID, for cache invalidations after a frontend deploy
    Value: !Ref SiteDistribution
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Paste into frontend/js/config.js (AUTH_CONFIG.clientId)
    Value: !Ref UserPoolClient
  AuthDomain:
    Description: Paste into frontend/js/config.js (AUTH_CONFIG.domain)
    Value: !Sub "${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  GoogleRedirectURI:
    Description: Add this as an "Authorized redirect URI" on the Google OAuth client
    Value: !Sub "https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
  ProgressTableName:
    Value: !Ref ProgressTable
  PostsTableName:
    Value: !Ref PostsTable
  GuestbookTableName:
    Value: !Ref GuestbookTable
