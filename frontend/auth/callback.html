<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Signing in - Aniket Surve</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EAS%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="../index.html">
        <span class="avatar brand-mark">AS</span>
        Aniket Surve
      </a>
    </div>
  </header>
  <main>
    <div class="container">
      <h1 id="title">Signing you in…</h1>
      <p class="lede" id="detail">One moment while we finish signing you in.</p>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    SiteAuth.handleCallback().catch(err => {
      document.getElementById("title").textContent = "Sign-in didn't complete";
      const p = document.getElementById("detail");
      p.textContent = (err && err.message ? err.message : "Something went wrong.") + " ";
      const a = document.createElement("a");
      a.href = "../index.html"; a.textContent = "Back to the home page";
      p.appendChild(a);
    });
  </script>
</body>
</html>
