<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="../../index.html">
        <span class="avatar brand-mark">AS</span>
        Aniket Surve
      </a>
      <nav class="site-nav">
        <a href="../../index.html">Home</a>
        <a href="../../blog/index.html">Blog</a>
        <a href="../../guestbook/index.html">Guestbook</a>
        <a href="../index.html" class="active">Apps</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <p><a href="index.html">&larr; Back to Music</a></p>
      <h1>Add Song</h1>
      <p class="lede">Uploads straight to S3 and registers the song in the player.</p>

      <form id="add-song-form" class="stack add-song-form">
        <div>
          <label for="song-password">Password</label>
          <input type="password" id="song-password" name="password" autocomplete="off" required />
        </div>
        <div>
          <label for="song-title">Title</label>
          <input type="text" id="song-title" name="title" required />
        </div>
        <div>
          <label for="song-artist">Artist</label>
          <input type="text" id="song-artist" name="artist" />
        </div>
        <div>
          <label for="song-audio">Audio file</label>
          <input type="file" id="song-audio" name="audio" accept="audio/*" required />
          <p id="audio-meta-status" class="status-message"></p>
        </div>
        <div id="cover-preview" class="cover-preview" hidden>
          <img id="cover-preview-img" alt="Embedded cover art" />
          <span>Found cover art in the file &mdash; will be used unless you pick a different image below.</span>
        </div>
        <div>
          <label for="song-cover">Cover image (optional)</label>
          <input type="file" id="song-cover" name="cover" accept="image/*" />
        </div>
        <div class="add-song-actions">
          <button type="submit" id="add-song-submit">Upload</button>
          <a href="index.html" class="btn btn-secondary">Cancel</a>
        </div>
        <p id="add-song-status" class="status-message"></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; <span id="year"></span> Aniket Surve</span>

        <a href="https://www.linkedin.com/in/aniket-surve/" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">in</a>
        <a href="mailto:aniket.surve.jobs@gmail.com" aria-label="Email" title="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <polyline points="2 7 12 13 22 7"></polyline>
          </svg>
        </a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>

</body>
