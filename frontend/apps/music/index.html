<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music - Aniket Surve</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EAS%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="../../index.html">
        <span class="avatar brand-mark">AS</span>
        Aniket Surve
      </a>
      <nav class="site-nav">
        <a href="../../index.html">Home</a>
        <a href="../../blog/index.html">Blog</a>
        <a href="../../guestbook/index.html">Guestbook</a>
        <a href="../index.html" class="active">Apps</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-title-row">
        <h1>Music</h1>
        <a href="add.html" class="btn btn-secondary">+ Add Song</a>
      </div>
      <p class="lede">Songs streamed straight from S3.</p>

      <div id="track-list" class="track-list">
        <p class="empty-state">Loading songs&hellip;</p>
      </div>
    </div>
  </main>

  <div class="now-playing-bar" id="now-playing-bar">
    <div class="np-cover" id="np-cover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </div>
    <div class="np-info">
      <div class="np-title" id="np-title">No track selected</div>
      <div class="np-artist" id="np-artist">&nbsp;</div>
    </div>
    <div class="np-main">
      <div class="np-controls">
        <button id="prev-btn" class="np-btn" aria-label="Previous track" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L10 12l10 6z"></path></svg>
        </button>
        <button id="play-btn" class="np-btn np-btn-play" aria-label="Play" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        </button>
        <button id="next-btn" class="np-btn" aria-label="Next track" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l10 6-10 6z"></path></svg>
        </button>
      </div>
      <div class="np-progress">
        <span id="current-time" class="np-time">0:00</span>
        <input type="range" id="seek" class="np-seek" min="0" max="100" value="0" step="0.1" disabled />
        <span id="duration" class="np-time">0:00</span>
      </div>
    </div>
    <div class="np-volume">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H2v6h4l5 4z"></path>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
      </svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
    </div>
  </div>

  <audio id="audio-el" preload="metadata"></audio>

  <script src="../../js/config.js"></script>
  <script src="music.js"></script>
  <script src="../../js/auth.js"></script>
</body>
</html>
